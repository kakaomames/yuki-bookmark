// 1. スラッシュで分ける関数（2020/02/14）
function formatDateWithSlash(input) {
  return String(input).replace(/^(\d{4})(\d{2})(\d{2})\$/, "\$1/\$2/\$3");
}

// 2. 0を消さない「〇月〇日」の関数（2020年02月14日）
function formatDateWithZero(input) {
  return String(input).replace(/^(\d{4})(\d{2})(\d{2})\$/, "\$1年\$2月\$3日");
}

// 3. 0を消してスッキリさせる「〇月〇日」の関数（2020年2月14日）
function formatDateWithoutZero(input) {
  const str = String(input);
  const year = str.substring(0, 4);
  const month = Number(str.substring(4, 6)); // 数値化して頭の0を消す
  const day = Number(str.substring(6, 8));   // 数値化して頭の0を消す
  
  return `${year}年${month}月${day}日`;
}

// 関数：配列を受け取って { itag: URL } のオブジェクトを返す
function createItagMap(urls) {
  // 配列が空、または配列ではないデータが来たら空のオブジェクトを返す（安全対策）
  if (!Array.isArray(urls)) return {};

  const itagMap = {};

  urls.forEach(url => {
    // URLから「/itag/数字/」の「数字」部分だけを抜き出す
    const match = url.match(/\/itag\/(\d+)\//);
    
    if (match) {
      const itagNumber = match[1]; // マッチした数字（"233" など）
      itagMap[itagNumber] = url;   // オブジェクトに追加
    }
  });

  return itagMap;
}
